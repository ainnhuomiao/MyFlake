name: Nix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NixOS x86_64-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ainnhuomiao
          skipPush: true

      # 只构建「上游任何二进制缓存里都没有、必须从源码编译」的包。
      # 其余包都能直接替换,列进来只会重复下载 + 上传(lock 更新后全部重来):
      #   - nixpkgs 自由软件      → cache.nixos.org (selector4nix 上游里也有 USTC 镜像)
      #   - nixpkgs unfree 应用   → 厂商 CDN 的预编译包(discord/vscode/chrome/qq/...)
      #   - llm-agents            → cache.numtide.com (omp/pi/reasonix/antigravity-cli/kimi-code)
      #   - noctalia / steam      → noctalia.cachix.org / nix-community.cachix.org
      #   - firefox-bin/zen-browser → 自行下载的厂商预编译包(仅重打包,无编译)
      # 复核某包是否该在这里:取 nix eval .#<pkg>.outPath 的 hash,查
      # https://<cache>/<hash>.narinfo;全 404 且属于「编译」类才留下。
      - name: Build cached packages
        id: cached-packages
        run: |
          paths=$(nix build \
            --no-link \
            --print-build-logs \
            --print-out-paths \
            --accept-flake-config \
            .#bili_tui \
            .#flake-stats-mcp \
            .#herdr \
            .#hyprpicker \
            .#mcp-nixos \
            .#motrix-next \
            .#selector4nix \
            .#swayfx \
            .#v2rayn)
          echo "paths=${paths//$'\n'/ }" >> "$GITHUB_OUTPUT"

      - name: Push cached packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@v17
        with:
          name: ainnhuomiao
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ${{ steps.cached-packages.outputs.paths }}
          skipAddingSubstituter: true

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Push to self-hosted attic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install nixpkgs#attic-client
          attic login vps https://ainnhuomiao.qianyuanqing.asia/ "$ATTIC_TOKEN"
          attic push ainnhuomiao ${{ steps.cached-packages.outputs.paths }}
