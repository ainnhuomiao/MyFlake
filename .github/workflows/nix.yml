name: Nix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NixOS x86_64-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # store 级缓存:空 store 启动时 unfree 包要从厂商 CDN 重新下载(约 1-2 GB),
      # 命中后这些 FOD 直接秒过。primary-key 基于 flake.lock hash,miss 时按前缀兜底旧缓存
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ainnhuomiao
          skipPush: true

      # 只构建「上游任何二进制缓存里都没有、必须从源码编译」的包。
      # 其余包都能直接替换,列进来只会重复下载 + 上传(lock 更新后全部重来):
      #   - nixpkgs 自由软件      → cache.nixos.org (selector4nix 上游里也有 USTC 镜像)
      #   - nixpkgs unfree 应用   → 厂商 CDN 的预编译包(discord/vscode/chrome/qq/...)
      #   - llm-agents            → cache.numtide.com (omp/pi/antigravity-cli/kimi-code)
      #   - noctalia / steam      → noctalia.cachix.org / nix-community.cachix.org
      #   - zen-browser           → 自行下载的厂商预编译包(仅重打包,无编译, 不入 CI)
      #   - firefox-bin           → 钉死 154.0 的厂商包重打包; 版本固定后入 CI, 命中 attic 避免每次重新拉取
      # 复核某包是否该在这里:取 nix eval .#<pkg>.outPath 的 hash,查
      # https://<cache>/<hash>.narinfo;全 404 且属于「编译」类才留下。
      - name: Build cached packages
        id: cached-packages
        run: |
          paths=$(nix build \
            --no-link \
            --print-build-logs \
            --print-out-paths \
            --accept-flake-config \
            .#bili_tui \
            .#dingtalk \
            .#firefox-bin \
            .#flake-stats-mcp \
            .#herdr \
            .#hyprpicker \
            .#linuxqq-wayland-fix \
            .#mcp-nixos \
            .#rayburst \
            .#noctalia \
            .#selector4nix \
            .#v2rayn)
          echo "paths=${paths//$'\n'/ }" >> "$GITHUB_OUTPUT"

      # check 放在两个 push 之前:失败时直接终止,避免 Cachix 与 Attic 内容分叉
      - name: Check flake
        run: nix flake check --print-build-logs

      # 系统 toplevel canary 已关掉:linux-cachyos 依赖 lantian attic 二进制缓存,
      # GitHub Actions 经常连不上该缓存(本机 curl 也握手失败),runner 就会从源码编内核,
      # 磁盘很快写满(No space left on device)。flake check + 上方源码包列表已覆盖大部分。
      # 等 lantian 对 GHA 稳定可达后再加回:
      #   nix build --no-link --accept-flake-config .#nixosConfigurations.nixos.config.system.build.toplevel

      - name: Push cached packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@v17
        with:
          name: ainnhuomiao
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ${{ steps.cached-packages.outputs.paths }}
          skipAddingSubstituter: true

      - name: Push to self-hosted attic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install --inputs-from . nixpkgs#attic-client
          attic login vps https://ainnhuomiao.qianyuanqing.asia/ "$ATTIC_TOKEN"
          attic push ainnhuomiao ${{ steps.cached-packages.outputs.paths }}
