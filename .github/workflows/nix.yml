name: Nix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NixOS x86_64-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ainnhuomiao
          skipPush: true

      - name: Build cached packages
        id: cached-packages
        run: |
          paths=$(nix build \
            --no-link \
            --print-build-logs \
            --print-out-paths \
            --accept-flake-config \
            .#bilibili \
            .#bili_tui \
            .#claude-code \
            .#discord \
            .#element-desktop \
            .#fcitx5-pinyin-moegirl \
            .#fcitx5-pinyin-zhwiki \
            .#feishu \
            .#flake-stats-mcp \
            .#github-copilot-cli \
            .#google-chrome \
            .#hmcl \
            .#mcp-nixos \
            .#microsoft-edge \
            .#motrix-next \
            .#nordic \
            .#noctalia \
            .#obsidian \
            .#omp \
            .#pi \
            .#qq \
            .#antigravity-cli \
            .#reasonix \
            .#swayfx \
            .#steam \
            .#thunderbird-bin \
            .#v2rayn \
            .#vscode \
            .#wechat \
            .#wemeet \
            .#wpsoffice-cn \
            .#zen-browser)
          echo "paths=${paths//$'\n'/ }" >> "$GITHUB_OUTPUT"

      - name: Push cached packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cachix/cachix-action@v17
        with:
          name: ainnhuomiao
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          pathsToPush: ${{ steps.cached-packages.outputs.paths }}
          skipAddingSubstituter: true

      - name: Check flake
        run: nix flake check --print-build-logs

      - name: Push to self-hosted attic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install nixpkgs#attic-client
          attic login vps https://ainnhuomiao.qianyuanqing.asia/ "$ATTIC_TOKEN"
          attic push ainnhuomiao ${{ steps.cached-packages.outputs.paths }}
