name: Nix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NixOS x86_64-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      # store 级缓存:空 store 启动时 unfree 包要从厂商 CDN 重新下载(约 1-2 GB),
      # 命中后这些 FOD 直接秒过。primary-key 基于 flake.lock hash,miss 时按前缀兜底旧缓存
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # check 放在 Attic 上传之前:失败时直接终止,避免上传未通过检查的产物。
      - name: Check flake
        run: nix flake check --print-build-logs

      # 候选集 = packages + environment.systemPackages + home-manager.users.huomiao.home.packages。
      # --skip-cached 查询全部已配置缓存,只构建未命中项;-j 2 允许适度并行,避免重型包无限并发 OOM。
      # 构建与上传分离,结果文件用于仅收集本次实际构建的最终输出。完整系统 toplevel 不在候选集中,
      # 避免拉取约 54 GiB 闭包撑爆标准 runner 的 14 GB 磁盘;完整系统仍需本机 `just build` 验证。
      - name: Build uncached packages
        run: |
          nix profile install --inputs-from . nixpkgs#nix-fast-build
          nix-fast-build \
            --flake .#legacyPackages.x86_64-linux.cacheOutputs \
            --skip-cached \
            --max-jobs 2 \
            --option accept-flake-config true \
            --result-file "$RUNNER_TEMP/nix-fast-build-results.json"

      # main 推送时上传 Attic;PR 只构建,不上传。上传最多 20 分钟并重试一次,避免网络阻塞拖住整个 CI。
      - name: Push built packages to Attic
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix profile install --inputs-from . nixpkgs#attic-client nixpkgs#jq
          attic login vps https://ainnhuomiao.qianyuanqing.asia/ "$ATTIC_TOKEN"
          mapfile -t paths < <(
            jq -r '.results[] | select(.type == "BUILD" and .success) | .outputs[]' \
              "$RUNNER_TEMP/nix-fast-build-results.json" | sort -u
          )
          if ((${#paths[@]} == 0)); then
            echo "No packages were built; skipping Attic upload"
            exit 0
          fi
          for attempt in 1 2; do
            if timeout 20m attic push ainnhuomiao "${paths[@]}"; then
              exit 0
            fi
            if ((attempt == 2)); then
              exit 1
            fi
            sleep 15
          done
